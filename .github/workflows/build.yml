name: Dummy_Runner_Trial_1

on:
  push:
    branches:
      - master

jobs:
  deploy-to-office:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Local Stack
        run: |
          # 1. Stop active containers to free up network ports
          docker compose down --remove-orphans
          
          # 2. Build the FastAPI backend and React frontend images locally
          docker compose build
          
          # 3. Boot up the entire architecture (DB, Backend, Frontend, Traefik proxy)
          docker compose up -d
          
          # 4. Clean up old dangling images to preserve office server storage
          docker image prune -f